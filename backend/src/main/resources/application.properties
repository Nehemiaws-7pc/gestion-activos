spring.application.name=gestion-activos-backend
server.port=${PORT:8080}

# Base de datos: defaults a H2 (desarrollo local).
# En produccion (Render), se sobreescribe con variables de entorno SPRING_DATASOURCE_URL / USERNAME / PASSWORD / DRIVER_CLASS_NAME / JPA_DATABASE_PLATFORM.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Consola H2 solo util en local; deshabilitarla en prod via H2_CONSOLE_ENABLED=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Serializacion de fechas como ISO string (no como array)
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT - Establece JWT_SECRET como variable de entorno en produccion
jwt.secret=${JWT_SECRET:superSecretKeyGestionActivos2026Nehemias2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - Sobreescribir en prod con APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://gestion-activos-frontend.onrender.com}
